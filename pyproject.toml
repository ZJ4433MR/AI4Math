[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4math-agent"
version = "0.2.0"
description = "General mathematical research agent with verifiable tools and a LABS plugin"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7", "PyYAML>=6", "matplotlib>=3.8", "reportlab>=4", "pypdf>=5", "sympy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8"]
fast = ["numba>=0.60"]

[project.scripts]
ai4math = "ai4math_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
